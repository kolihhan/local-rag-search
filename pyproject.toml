[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-search"
version = "0.1.0"
description = "Local-first hybrid search for RAG applications."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27"]

[project.scripts]
rag-search = "local_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
