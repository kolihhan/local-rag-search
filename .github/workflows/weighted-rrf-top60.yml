name: Weighted RRF Top60 Diagnostic

on:
  push:
    branches:
      - experiment/weighted-rrf-valid
    paths:
      - ".github/workflows/weighted-rrf-top60.yml"
      - "evaluation/weighted_rrf_experiment.py"
      - "tests/test_weighted_rrf_experiment.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weighted-rrf-top60:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull embedding model
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen3-embedding:0.6b
      - name: Download frozen EnterpriseRAG v1.0.0 inputs
        run: |
          mkdir -p /tmp/enterprise-rag/slice1 /tmp/enterprise-rag/slice2
          curl -fL "https://github.com/onyx-dot-app/EnterpriseRAG-Bench/releases/download/v1.0.0/confluence_slice_0001.zip" -o /tmp/enterprise-rag/slice1.zip
          curl -fL "https://github.com/onyx-dot-app/EnterpriseRAG-Bench/releases/download/v1.0.0/confluence_slice_0002.zip" -o /tmp/enterprise-rag/slice2.zip
          curl -fL "https://github.com/onyx-dot-app/EnterpriseRAG-Bench/releases/download/v1.0.0/questions.jsonl" -o /tmp/enterprise-rag/questions.jsonl
          echo "a79320d9c11b58c904ddc444f4b5c374ea1d9e6e3075974bcaea294c2a7e2eb5  /tmp/enterprise-rag/slice1.zip" | sha256sum -c -
          echo "ecb4e395f710f0eef8332b1e27182c00223da847945a010c10078b3e0c693024  /tmp/enterprise-rag/slice2.zip" | sha256sum -c -
          echo "f9524b9157cd43aae36b99333a124738804306ea6d07f332d49faa6d3d147905  /tmp/enterprise-rag/questions.jsonl" | sha256sum -c -
          unzip -q /tmp/enterprise-rag/slice1.zip -d /tmp/enterprise-rag/slice1
          unzip -q /tmp/enterprise-rag/slice2.zip -d /tmp/enterprise-rag/slice2
          test "$(find /tmp/enterprise-rag/slice1 /tmp/enterprise-rag/slice2 -type f -name '*.txt' | wc -l)" -eq 5189
      - name: Run top60 weighted RRF diagnostic
        run: |
          python evaluation/weighted_rrf_experiment.py \
            --corpus-root /tmp/enterprise-rag/slice1 \
            --corpus-root /tmp/enterprise-rag/slice2 \
            --questions /tmp/enterprise-rag/questions.jsonl \
            --cache /tmp/enterprise-rag/qwen-cache.json \
            --canonical-report runs/enterprise-rag-qwen-core-v1/report.json \
            --output weighted-rrf-top60-result.json
      - name: Show result
        if: always()
        run: |
          if [ -f weighted-rrf-top60-result.json ]; then
            python -c "import json; d=json.load(open('weighted-rrf-top60-result.json')); print(json.dumps({'baseline_reproduced':d.get('baseline_reproduced'),'promotion_status':d.get('promotion_status'),'winner':d.get('winner')}, indent=2))"
          else
            cat /tmp/ollama.log || true
          fi
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weighted-rrf-top60-diagnostic
          path: weighted-rrf-top60-result.json
          if-no-files-found: warn
